<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
  <div>
    <div class="flex items-center gap-2">
      <h1 class="text-[22px] sm:text-[28px] font-semibold tracking-tight text-slate-900">Health & sickbay</h1>
      <span class="text-[11px] bg-rose-50 text-rose-700 px-2 py-0.5 rounded-full">Restricted</span>
    </div>
    <p class="text-sm text-slate-400 mt-1">Nurse visits attach to the same student record — not a separate file</p>
  </div>
  <button type="button" (click)="logVisit()" class="h-10 px-4 text-sm bg-slate-900 text-white rounded-full shrink-0">+ Log visit</button>
</div>

<app-stat-cards [items]="stats()" />

<div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-slate-50 text-xs text-slate-400"><tr class="text-left">
      <th class="px-4 py-3 font-medium">Student</th><th class="px-4 py-3 font-medium">Reason</th><th class="px-4 py-3 font-medium">Action</th><th class="px-4 py-3 font-medium">Time</th><th class="px-4 py-3 font-medium">Parent</th><th class="px-4 py-3 font-medium"></th>
    </tr></thead>
    <tbody class="divide-y divide-slate-50">
      @for (v of os.visits(); track v.id) {
        <tr>
          <td class="px-4 py-3"><p class="font-medium text-slate-900">{{ v.name }}</p><p class="font-mono text-[11px] text-slate-400">{{ v.adm }}</p></td>
          <td class="px-4 py-3 text-slate-700">{{ v.reason }}</td>
          <td class="px-4 py-3 text-slate-600">{{ v.action }}</td>
          <td class="px-4 py-3 text-slate-500">{{ v.time }}</td>
          <td class="px-4 py-3">
            @if (v.notified) {
              <span class="text-xs text-emerald-600">Notified</span>
            } @else {
              <button type="button" (click)="notify(v.id, v.name)" class="text-xs text-slate-700 hover:underline">Notify parent</button>
            }
          </td>
          <td class="px-4 py-3">
            <button type="button" (click)="sickNote(v.id, v.name)" class="text-xs text-slate-700 hover:underline">PDF</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
