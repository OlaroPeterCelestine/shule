<div class="flex items-center justify-between mb-5">
          <div>
            <h1 class="font-display text-2xl text-ink">Visitors & Gate</h1>
            <p class="text-sm text-slate2/60 mt-1">{{ visitors().filter(v => v.status === 'On campus').length }} visitors on campus now</p>
          </div>
          <button type="button" (click)="checkIn()" class="bg-ink text-white text-sm px-4 py-2 rounded-sm flex items-center gap-1.5 hover:bg-inkdeep"><svg class="ic text-white"><use href="#i-plus"/></svg> Check in visitor</button>
        </div>
        <div class="bg-white border border-line rounded-sm overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-canvas text-xs text-slate2/60"><tr class="text-left"><th class="px-4 py-3 font-normal">Visitor</th><th class="px-4 py-3 font-normal">Purpose</th><th class="px-4 py-3 font-normal">Host</th><th class="px-4 py-3 font-normal">Badge</th><th class="px-4 py-3 font-normal">Status</th><th class="px-4 py-3 font-normal"></th></tr></thead>
            <tbody class="divide-y divide-line">
              @for (v of visitors(); track v.id) {
                <tr>
                  <td class="px-4 py-3">{{ v.name }}</td>
                  <td class="px-4 py-3">{{ v.purpose }}</td>
                  <td class="px-4 py-3">{{ v.host }}</td>
                  <td class="px-4 py-3 font-mono text-xs">{{ v.badge }}</td>
                  <td class="px-4 py-3" [class.text-primary]="v.status === 'On campus'" [class.text-slate2/50]="v.status !== 'On campus'">{{ v.status }}</td>
                  <td class="px-4 py-3">
                    @if (v.status === 'On campus') {
                      <button type="button" (click)="checkout(v.id)" class="text-xs text-maroon hover:underline">Check out</button>
                    } @else {
                      <span class="text-xs text-slate2/30">—</span>
                    }
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
