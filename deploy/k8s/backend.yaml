apiVersion: v1
kind: Namespace
metadata:
  name: littleroyals
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: littleroyals
data:
  HOST: 0.0.0.0
  PORT: '3000'
  NODE_ENV: production
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: littleroyals.school
  OPENSEARCH_NODE: http://opensearch:9200
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: littleroyals
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: littleroyals
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: littleroyals-api:0.0.1
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          readinessProbe:
            httpGet: { path: /api/status, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api, port: 3000 }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: littleroyals
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
